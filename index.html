* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14.5px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 72px; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.tnum { font-variant-numeric: tabular-nums; }

/* header + nav */
.bar { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px 0; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 16px; font-weight: 600; margin: 0; }
.tag { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.brand .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { padding: 9px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs a i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.note-banner { font-size: 13px; color: var(--ink-2); background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: 10px; padding: 9px 13px; margin: 14px 0 0; }

/* layout */
.panel { background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 18px; margin-top: 14px; min-width: 0; }
.panel h2 { font-size: 15.5px; font-weight: 600; margin: 0; }
.panel .sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .g2 > .panel { margin-top: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; } .g3 > .panel { margin-top: 14px; }
.g2 > *, .g3 > * { min-width: 0; }
@media (max-width: 960px) { .g2, .g3 { grid-template-columns: 1fr; } .g2 > .panel + .panel, .g3 > .panel + .panel { margin-top: 0; } }
.pagehead { margin: 22px 2px 4px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.pagehead h2 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.pagehead .meta { margin-left: auto; font-size: 13px; color: var(--ink-2); text-align: right; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: 12px; padding: 12px 14px; }
.tile .l { font-size: 12.5px; color: var(--ink-2); }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
.tile .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.tile.hero .v { font-size: 30px; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.mini > div { background: var(--surface-2); border-radius: 9px; padding: 9px 11px; }
.mini .l { font-size: 12px; color: var(--ink-2); } .mini .v { font-size: 16px; font-weight: 600; white-space: nowrap; } .mini .s { font-size: 11.5px; color: var(--muted); }

/* segmented controls */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--ring), 0 1px 2px var(--ring); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }

/* tables */
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--ink); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; border-top: 1px solid var(--axis); border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.n .sub2 { white-space: nowrap; }
.sym { font-weight: 600; } .sub2 { display: block; font-size: 11.5px; color: var(--muted); white-space: normal; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; margin-left: 6px; }
.chip.v { background: var(--warn-bg); color: var(--warn); }
.status { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.status.ok { background: var(--ok-bg); color: var(--gain); } .status.warning { background: var(--warn-bg); color: var(--warn); }
.status.breach { background: var(--loss-wash); color: var(--loss); }
.linkbtn { border: 0; background: none; color: var(--link); font-weight: 600; cursor: pointer; padding: 2px 4px; font-size: 12.5px; }
.note { color: var(--ink-2); font-size: 13px; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 500; padding: 4px 0; }

/* bars & charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0,0,0,.14); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; min-width: 150px; opacity: 0; z-index: 5; }
.tip .d { color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r span:first-child { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .k { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 32%) 1fr 92px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.hbar .track { position: relative; height: 18px; }
.hbar .b1 { position: absolute; left: 0; top: 2px; height: 8px; border-radius: 0 3px 3px 0; }
.hbar .b2 { position: absolute; left: 0; top: 11px; height: 5px; border-radius: 0 3px 3px 0; background: var(--bench); opacity: .55; }
.hbar .tick { position: absolute; top: 0; width: 2px; height: 18px; background: var(--ink); border-radius: 1px; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; }
.gauge { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; width: 110px; }
.gauge .zone { position: absolute; top: 0; height: 8px; background: var(--ok-bg); border-radius: 4px; }
.gauge .pin { position: absolute; top: -3px; width: 3px; height: 14px; border-radius: 2px; background: var(--ink); }
.heat td.cell { text-align: right; font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; gap: 2px; border-radius: 6px; overflow: hidden; margin: 4px 0 10px; }
.stack span { display: block; height: 100%; }

/* dialog */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(480px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.28); }
dialog::backdrop { background: rgba(10,18,26,.5); }
.dlg { padding: 20px; }

.field { margin-bottom: 11px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg button.buy[aria-pressed="true"] { color: var(--gain); } .seg button.sell[aria-pressed="true"] { color: var(--loss); }
.preview { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); margin: 4px 0 12px; }
.preview b { color: var(--ink); font-weight: 600; }
.checks { list-style: none; padding: 0; margin: 6px 0 0; }
.checks li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-size: 12.5px; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; }
.msg { font-size: 13px; margin: 8px 0 10px; padding: 8px 11px; border-radius: 8px; }
.msg.err { background: var(--loss-wash); color: var(--loss); } .msg.info { background: var(--warn-bg); color: var(--warn); } .msg.good { background: var(--ok-bg); color: var(--gain); }
.steps { list-style: none; padding: 0; margin: 4px 0 14px; }
.steps li { display: flex; gap: 10px; align-items: center; padding: 6px 0; color: var(--muted); font-size: 14px; }
.steps li .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); flex: none; display: grid; place-items: center; font-size: 11px; }
.steps li.active { color: var(--ink); } .steps li.active .dot { box-shadow: inset 0 0 0 2px var(--s1); animation: pulse 1.2s ease-in-out infinite; }
.steps li.done { color: var(--ink); } .steps li.done .dot { background: var(--gain); box-shadow: none; color: #fff; }
.steps li.fail .dot { background: var(--loss); box-shadow: none; color: #fff; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 5px var(--s1); } }
@media (prefers-reduced-motion: reduce) { .steps li.active .dot { animation: none; } }
@media (max-width: 600px) { .panel { padding: 14px; } .pagehead .meta { margin-left: 0; text-align: left; } .brand .right .age { display: none; } }

<script>
(function () {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.portfolios, IDS = Object.keys(P);
const PCOL = {}; IDS.forEach((id, i) => PCOL[id] = `var(--s${i + 1})`);
const U = {}; D.universe.forEach(u => U[u.symbol] = u);
const NS = 'http://www.w3.org/2000/svg';

// ---------------- format
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v, d = 0) => v == null || !isFinite(v) ? '–' : (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const mshort = v => { if (v == null || !isFinite(v)) return '–'; const a = Math.abs(v), s = v < 0 ? '−' : '';
  return a >= 1e9 ? s + '$' + (a / 1e9).toFixed(2) + 'B' : a >= 1e6 ? s + '$' + (a / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + 'M' : a >= 1e3 ? s + '$' + (a / 1e3).toFixed(0) + 'K' : s + '$' + a.toFixed(0); };
const smoney = (v, d = 0) => v == null || !isFinite(v) ? '–' : (v > 0.004 ? '+' : '') + money(v, d);
const pct = (v, d = 1) => v == null || !isFinite(v) ? '–' : (v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';
const spct = (v, d = 1) => v == null || !isFinite(v) ? '–' : (v > 0.00005 ? '+' : v < -0.00005 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';
const bps = v => v == null || !isFinite(v) ? '–' : (v > 0.000005 ? '+' : v < -0.000005 ? '−' : '') + Math.abs(v * 1e4).toFixed(0) + ' bp';
const cls = v => v > 0.000005 ? 'gain' : v < -0.000005 ? 'loss' : 'muted';
const num = (v, d = 2) => v == null || !isFinite(v) ? '–' : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const units = v => (+v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const fdate = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', o);
const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
const AC_COL = { 'Equity': 'var(--s1)', 'Fixed Income': 'var(--s3)', 'Real Assets': 'var(--s4)', 'Cash & Equivalents': 'var(--bench)' };

// ---------------- svg helpers
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) hi = lo + 1;
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
  if (out[out.length - 1] < hi) out.push(out[out.length - 1] + step);
  return out;
}
function makeTip(box) { const t = document.createElement('div'); t.className = 'tip'; box.appendChild(t); return t; }
function fillTip(tip, title, rows) {
  tip.replaceChildren(); const d = document.createElement('div'); d.className = 'd'; d.textContent = title; tip.appendChild(d);
  rows.forEach(([label, value, color, vc]) => { const r = document.createElement('div'); r.className = 'r'; const a = document.createElement('span');
    if (color) { const k = document.createElement('i'); k.className = 'k'; k.style.background = color; a.appendChild(k); }
    a.appendChild(document.createTextNode(label)); const b = document.createElement('b'); b.textContent = value; if (vc) b.className = vc; r.append(a, b); tip.appendChild(r); });
}
function placeTip(tip, box, x, y) { const w = tip.offsetWidth, bw = box.clientWidth; let left = x + 14; if (left + w > bw) left = x - w - 14; if (left < 0) left = 0;
  tip.style.left = left + 'px'; tip.style.top = Math.max(0, y - 10) + 'px'; tip.style.opacity = 1; }
const watchers = []; const onResize = fn => { watchers.push(fn); fn(); };
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => watchers.forEach(f => { try { f(); } catch (e) {} }), 150); });

// line / stacked-area chart with crosshair. series: [{label,color,values,area?,dash?}] ; stacked: bool
function lineChart(box, { dates, series, height = 260, fmtY = mshort, stacked = false, zeroLine = false, tipTitle, tipRows }) {
  box.replaceChildren(); const n = dates.length; if (n < 2) { box.innerHTML = '<p class="note">Not enough history yet.</p>'; return; }
  const W = Math.max(280, box.clientWidth), H = height, pl = 56, pr = 12, pt = 10, pb = 26;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img' }, box); const tip = makeTip(box);
  let tops = series.map(s => s.values);
  if (stacked) { const acc = new Array(n).fill(0); tops = series.map(s => s.values.map((v, i) => (acc[i] += v || 0))); }
  let lo = Infinity, hi = -Infinity; tops.forEach(a => a.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (stacked || zeroLine) lo = Math.min(lo, 0);
  const pad = (hi - lo) * 0.06 || 1; if (!stacked) lo -= pad; hi += pad;
  const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const x = i => pl + i / (n - 1) * (W - pl - pr), y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  ticks.forEach(v => { if (v < lo || v > hi) return; el('line', { x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: v === 0 && zeroLine ? 'var(--axis)' : 'var(--line)' }, svg);
    el('text', { x: pl - 8, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmtY(v); });
  const k = Math.min(W < 520 ? 3 : 6, n); const span = (new Date(dates[n - 1]) - new Date(dates[0])) / 864e5;
  for (let j = 0; j < k; j++) { const i = Math.round(j * (n - 1) / (k - 1));
    el('text', { x: x(i), y: H - 6, 'text-anchor': j === 0 ? 'start' : j === k - 1 ? 'end' : 'middle' }, svg).textContent = fdate(dates[i], span > 300 ? { month: 'short', year: '2-digit' } : { day: 'numeric', month: 'short' }); }
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  if (stacked) { let base = new Array(n).fill(0);
    tops.forEach((t, si) => { const d = path(t) + base.map((v, i) => `L${x(n - 1 - i).toFixed(1)},${y(base[n - 1 - i]).toFixed(1)}`).join('') + 'Z';
      el('path', { d, fill: series[si].color, 'fill-opacity': 0.85 }, svg); el('path', { d: path(t), fill: 'none', stroke: 'var(--surface)', 'stroke-width': 1.5 }, svg); base = t; }); }
  else series.forEach((s, si) => { if (s.area) { const d = path(tops[si]) + `L${x(n - 1)},${y(Math.max(lo, 0))}L${x(0)},${y(Math.max(lo, 0))}Z`; el('path', { d, fill: s.color, 'fill-opacity': 0.08 }, svg); }
    el('path', { d: path(tops[si]), fill: 'none', stroke: s.color, 'stroke-width': s.width || 2, 'stroke-dasharray': s.dash || '', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg); });
  const cross = el('line', { y1: pt, y2: H - pb, stroke: 'var(--axis)', opacity: 0 }, svg);
  const dots = tops.map((t, si) => el('circle', { r: 4, fill: series[si].color, stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 }, svg));
  const hit = el('rect', { x: pl, y: pt, width: W - pl - pr, height: H - pt - pb, fill: 'transparent' }, svg);
  const move = cx => { const r = svg.getBoundingClientRect(); const px = (cx - r.left) * W / r.width; const i = Math.max(0, Math.min(n - 1, Math.round((px - pl) / (W - pl - pr) * (n - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', 1);
    dots.forEach((d, si) => { d.setAttribute('cx', x(i)); d.setAttribute('cy', y(tops[si][i])); d.setAttribute('opacity', 1); });
    fillTip(tip, tipTitle ? tipTitle(i) : fdate(dates[i]), tipRows(i)); placeTip(tip, box, x(i) * r.width / W, y(Math.max(...tops.map(t => t[i]))) * r.height / H); };
  hit.addEventListener('pointermove', e => move(e.clientX)); hit.addEventListener('pointerdown', e => move(e.clientX));
  hit.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); tip.style.opacity = 0; });
}

// diverging horizontal bars. items [{label,value,rows,color?}]
function divBars(box, items, fmt = v => spct(v, 2)) {
  box.replaceChildren(); if (!items.length) { box.innerHTML = '<p class="note">Nothing to show.</p>'; return; }
  const W = Math.max(280, box.clientWidth), rowH = 24, H = items.length * rowH + 4, lab = 70, valW = 64;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H }, box); const tip = makeTip(box);
  const neg = Math.max(0, ...items.map(i => -i.value)), pos = Math.max(0, ...items.map(i => i.value));
  const L = lab + (neg > 0 ? valW : 0), R = W - (pos > 0 ? valW : 8), scale = (R - L) / ((neg + pos) || 1), x0 = L + neg * scale;
  el('line', { x1: x0, x2: x0, y1: 0, y2: H, stroke: 'var(--axis)' }, svg);
  items.forEach((it, i) => { const cy = i * rowH + rowH / 2 + 2, w = Math.abs(it.value) * scale, up = it.value >= 0, bh = 11, xs = up ? x0 : x0 - w, r = Math.min(4, w / 2);
    const d = up ? `M${xs},${cy - bh / 2}H${xs + w - r}Q${xs + w},${cy - bh / 2} ${xs + w},${cy - bh / 2 + r}V${cy + bh / 2 - r}Q${xs + w},${cy + bh / 2} ${xs + w - r},${cy + bh / 2}H${xs}Z`
      : `M${x0},${cy - bh / 2}H${xs + r}Q${xs},${cy - bh / 2} ${xs},${cy - bh / 2 + r}V${cy + bh / 2 - r}Q${xs},${cy + bh / 2} ${xs + r},${cy + bh / 2}H${x0}Z`;
    const bar = el('path', { d, fill: it.color || (up ? 'var(--gain)' : 'var(--loss)') }, svg);
    const t = el('text', { x: 0, y: cy + 4 }, svg); t.textContent = it.label; t.style.fill = 'var(--ink)'; t.style.fontWeight = 600; t.style.fontSize = '12px';
    const v = el('text', { x: up ? xs + w + 6 : xs - 6, y: cy + 4, 'text-anchor': up ? 'start' : 'end' }, svg); v.textContent = fmt(it.value);
    const hr = el('rect', { x: 0, y: i * rowH + 2, width: W, height: rowH, fill: 'transparent', tabindex: 0 }, svg);
    const show = () => { bar.setAttribute('opacity', .8); fillTip(tip, it.title || it.label, it.rows || [['Value', fmt(it.value)]]); const rr = svg.getBoundingClientRect(); placeTip(tip, box, (up ? xs + w : xs) * rr.width / W, cy * rr.height / H); };
    const hide = () => { bar.setAttribute('opacity', 1); tip.style.opacity = 0; };
    hr.addEventListener('pointerenter', show); hr.addEventListener('pointerleave', hide); hr.addEventListener('focus', show); hr.addEventListener('blur', hide); });
}

// histogram with VaR marker
function histogram(box, counts, edges, varLine) {
  box.replaceChildren(); const W = Math.max(280, box.clientWidth), H = 170, pl = 8, pr = 8, pt = 16, pb = 24;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H }, box); const tip = makeTip(box);
  const mx = Math.max(...counts), n = counts.length, lo = edges[0], hi = edges[n];
  const x = v => pl + (v - lo) / (hi - lo) * (W - pl - pr), bw = (W - pl - pr) / n;
  counts.forEach((c, i) => { const h = c / mx * (H - pt - pb); const left = edges[i] < -varLine;
    const r = el('rect', { x: pl + i * bw + 1, y: H - pb - h, width: Math.max(1, bw - 2), height: h, rx: 2, fill: left ? 'var(--loss)' : 'var(--s1)', 'fill-opacity': left ? 0.9 : 0.55 }, svg);
    const hr = el('rect', { x: pl + i * bw, y: pt, width: bw, height: H - pt - pb, fill: 'transparent' }, svg);
    hr.addEventListener('pointerenter', () => { fillTip(tip, `${spct(edges[i], 2)} to ${spct(edges[i + 1], 2)}`, [['Days', String(c)]]); const rr = svg.getBoundingClientRect(); placeTip(tip, box, (pl + i * bw) * rr.width / W, (H - pb - h) * rr.height / H); });
    hr.addEventListener('pointerleave', () => tip.style.opacity = 0); });
  el('line', { x1: x(-varLine), x2: x(-varLine), y1: pt - 6, y2: H - pb, stroke: 'var(--ink)', 'stroke-width': 1.5 }, svg);
  const t = el('text', { x: x(-varLine) + 5, y: pt + 2 }, svg); t.textContent = `VaR 95% ${spct(-varLine, 2)}`; t.style.fill = 'var(--ink)';
  [lo, 0, hi].forEach((v, j) => { el('text', { x: x(v), y: H - 6, 'text-anchor': j === 0 ? 'start' : j === 2 ? 'end' : 'middle' }, svg).textContent = spct(v, 1); });
}

  const rb = p.rebalancing, out = rb.rows.filter(r => r.outside);
  document.getElementById('rebal').innerHTML = (rb.trades.length ? `<div class="tbl"><table><thead><tr><th>Trade</th><th class="n">Quantity</th><th class="n">Notional</th><th class="n">Weight</th><th class="n">Est. cost</th><th></th></tr></thead><tbody>
    ${rb.trades.map(t => `<tr><td><span class="${t.side === 'buy' ? 'gain' : 'loss'}">${t.side === 'buy' ? 'Buy' : 'Sell'}</span> <span class="sym">${esc(t.symbol)}</span><span class="sub2">${esc(t.reason)}</span></td><td class="n">${units(t.qty)}</td><td class="n">${money(t.notional)}</td><td class="n">${pct(t.from, 2)} → ${pct(t.to, 2)}</td><td class="n">${money(t.est_cost)}</td>
      <td class="n"><button class="linkbtn" data-rb="${esc(t.symbol)}|${t.side}|${t.qty}">Trade</button></td></tr>`).join('')}</tbody></table></div>
    <p class="note" style="margin-top:8px">Turnover ${pct(rb.turnover, 2)} of the portfolio; net cash ${smoney(rb.net_cash)}.</p>` : '<p class="note">Every holding is within tolerance of its model weight. No trades needed.</p>') +
    `<details style="margin-top:6px"><summary>Drift by holding</summary><div class="tbl"><table><thead><tr><th>Holding</th><th class="n">Weight</th><th class="n">Target</th><th class="n">Drift</th><th class="n">Tolerance</th></tr></thead><tbody>
    ${rb.rows.map(r => `<tr><td class="sym">${esc(r.symbol === 'CASH' ? 'Cash' : r.symbol)}</td><td class="n">${pct(r.weight, 2)}</td><td class="n">${pct(r.target, 2)}</td><td class="n ${r.outside ? 'loss' : 'muted'}">${spct(r.drift, 2)}</td><td class="n">±${pct(r.tolerance, 2)}</td></tr>`).join('')}</tbody></table></div></details>`;
  document.querySelectorAll('[data-rb]').forEach(b => b.addEventListener('click', () => { const [s, side, q] = b.dataset.rb.split('|'); openTrade({ portfolio: id, symbol: s, side, qty: q }); }));

  // income chart (monthly columns, last 24 months)
  onResize(() => { const box = document.getElementById('incChart'); const m = inc.by_month.slice(-24); if (!m.length) { box.innerHTML = ''; return; }
    box.replaceChildren(); const W = Math.max(280, box.clientWidth), Hh = 150, pl = 44, pb = 22, pt = 8;
    const svg = el('svg', { viewBox: `0 0 ${W} ${Hh}`, height: Hh }, box); const tip = makeTip(box); const mx = Math.max(...m.map(x => x.amount)); const tk = niceTicks(0, mx, 3); const top = tk[tk.length - 1];
    const band = (W - pl) / m.length, bw = Math.min(18, band * 0.7);
    tk.forEach(v => { const yy = pt + (top - v) / top * (Hh - pt - pb); el('line', { x1: pl, x2: W, y1: yy, y2: yy, stroke: v === 0 ? 'var(--axis)' : 'var(--line)' }, svg); el('text', { x: pl - 6, y: yy + 4, 'text-anchor': 'end' }, svg).textContent = mshort(v); });
    m.forEach((x, i) => { const hgt = x.amount / top * (Hh - pt - pb), cx = pl + band * i + band / 2; const rr = Math.min(3, hgt);
      el('path', { d: `M${cx - bw / 2},${Hh - pb}V${Hh - pb - hgt + rr}Q${cx - bw / 2},${Hh - pb - hgt} ${cx - bw / 2 + rr},${Hh - pb - hgt}H${cx + bw / 2 - rr}Q${cx + bw / 2},${Hh - pb - hgt} ${cx + bw / 2},${Hh - pb - hgt + rr}V${Hh - pb}Z`, fill: PCOL[id] }, svg);
      if (i % Math.ceil(m.length / 8) === 0) el('text', { x: cx, y: Hh - 6, 'text-anchor': 'middle' }, svg).textContent = fdate(x.month + '-01', { month: 'short', year: '2-digit' });
      const hr = el('rect', { x: pl + band * i, y: pt, width: band, height: Hh - pt - pb, fill: 'transparent' }, svg);
      hr.addEventListener('pointerenter', () => { fillTip(tip, fdate(x.month + '-01', { month: 'long', year: 'numeric' }), [['Income received', money(x.amount)]]); const r2 = svg.getBoundingClientRect(); placeTip(tip, box, cx * r2.width / W, (Hh - pb - hgt) * r2.height / Hh); });
      hr.addEventListener('pointerleave', () => tip.style.opacity = 0); }); });
}
function segment(elId, fn) { const g = document.getElementById(elId); g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  [...g.children].forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b.dataset.v); }); }

// ================= TRADE TICKET (with pre-trade compliance preview)
const dlg = document.getElementById('dlg'), body = document.getElementById('dlgBody');
let apiState = null;
async function checkApi() { if (location.protocol === 'file:') return 'none'; try { const r = await fetch('api/status', { cache: 'no-store' }); if (!r.ok) return 'none'; return (await r.json()).configured; } catch { return 'none'; } }
function state(pid) { const p = P[pid]; const qty = {}; p.holdings.filter(h => h.open).forEach(h => qty[h.symbol] = h.qty); return { qty, cash: p.cash }; }
function measures(qty, cash) { let tv = cash; const w = {}; for (const s in qty) tv += qty[s] * U[s].price; for (const s in qty) w[s] = qty[s] * U[s].price / tv;
  const ac = {}; for (const s in w) for (const [k, x] of Object.entries(U[s].classify.asset_class)) ac[k] = (ac[k] || 0) + w[s] * x; ac['Cash & Equivalents'] = (ac['Cash & Equivalents'] || 0) + cash / tv;
  const pick = kind => Object.entries(w).filter(([s]) => U[s].kind === kind).sort((a, b) => b[1] - a[1])[0] || ['', 0];
  return { tv, w, cash_w: cash / tv, ac, stock: pick('stock'), fund: pick('etf') }; }
function ruleVal(rule, m) { if (rule === 'max_single_stock') return [m.stock[1], m.stock[0]]; if (rule === 'max_single_fund') return [m.fund[1], m.fund[0]]; if (rule === 'min_cash' || rule === 'cash') return [m.cash_w, ''];
  const n = { equity: 'Equity', fixed_income: 'Fixed Income', real_assets: 'Real Assets' }[rule]; return n ? [m.ac[n] || 0, ''] : [null, '']; }
const outside = (v, lo, hi) => v == null ? 0 : hi != null && v > hi ? v - hi : lo != null && v < lo ? lo - v : 0;
const LBL = { max_single_stock: 'Single stock', max_single_fund: 'Single fund', min_cash: 'Cash ≥ 0', cash: 'Uninvested cash', equity: 'Equity allocation', fixed_income: 'Fixed income allocation', real_assets: 'Real assets allocation' };
function pretrade(t) {
  const res = { ok: false, msg: '', checks: [], notional: 0, fees: 0, after: null };
  const sym = (t.symbol || '').toUpperCase(), u = U[sym]; const q = Number(t.qty);
  if (!u) { res.msg = sym ? `${sym} isn't in the approved universe.` : 'Pick a symbol from the approved list.'; return res; }
  if (!(q > 0) || Math.floor(q) !== q) { res.msg = 'Enter a whole number of shares.'; return res; }
  const st = state(t.portfolio), before = measures(st.qty, st.cash), held = st.qty[sym] || 0;
  res.notional = q * u.price; res.fees = Math.max(5, res.notional * 2e-4);
  if (t.side === 'sell' && q > held) { res.msg = `The portfolio holds ${units(held)} ${sym}; short selling isn't allowed.`; return res; }
  if (res.notional > 0.25 * before.tv) { res.msg = `One trade can't exceed 25% of the portfolio (${mshort(0.25 * before.tv)}).`; return res; }
  const qty = { ...st.qty }; qty[sym] = held + (t.side === 'buy' ? q : -q); if (Math.abs(qty[sym]) < 1e-9) delete qty[sym];
  const cash = st.cash - (t.side === 'buy' ? res.notional : -res.notional) - res.fees;
  if (cash < 0) { res.msg = `Not enough cash: needs ${money(res.notional + res.fees)}, the portfolio has ${money(st.cash)}.`; return res; }
  const after = measures(qty, cash); res.after = after; let blocked = false;
  D.limits[t.portfolio].forEach(l => { const [v0] = ruleVal(l.rule, before), [v1, who] = ruleVal(l.rule, after); if (v1 == null) return;
    const d0 = outside(v0, l.min, l.max), d1 = outside(v1, l.min, l.max); const worse = d1 > d0 + 1e-12;
    if (worse && l.severity === 'hard') blocked = true;
    res.checks.push({ label: LBL[l.rule] || l.rule, who, v: v1, l, state: worse ? (l.severity === 'hard' ? 'block' : 'warn') : d1 > 0 ? 'still' : 'ok' }); });
  res.ok = !blocked; if (blocked) res.msg = 'Blocked by pre-trade compliance: the trade would breach a hard mandate limit.';
  return res;
}
function openTrade(pre = {}) {
  const st = { portfolio: current !== 'overview' ? current : IDS[0], side: 'buy', symbol: '', qty: '', ...pre };
  if (pre.side) st.side = pre.side;
  function render(err) {
    const res = st.symbol && st.qty ? pretrade(st) : null; const u = U[(st.symbol || '').toUpperCase()]; const held = u ? (state(st.portfolio).qty[u.symbol] || 0) : 0;
    body.innerHTML = `<h3 id="dlgTitle">New trade</h3><p class="note" style="margin:0 0 12px">Executes at the latest market price with 2 bp commission. Visitor trades expire after 7 days.</p>
      ${apiState === 'none' ? '<p class="msg info">Trading works on the hosted dashboard; this copy can only preview.</p>' : apiState === false ? '<p class="msg info">Trading isn\'t switched on for this site yet.</p>' : ''}
      ${err ? `<p class="msg err">${esc(err)}</p>` : ''}
      <div class="field"><label for="t-p">Portfolio</label><select id="t-p">${IDS.map(id => `<option value="${id}" ${id === st.portfolio ? 'selected' : ''}>${esc(P[id].name)}</option>`).join('')}</select></div>
      <div class="field"><div class="seg full" id="t-side"><button type="button" class="buy" data-v="buy" aria-pressed="${st.side === 'buy'}">Buy</button><button type="button" class="sell" data-v="sell" aria-pressed="${st.side === 'sell'}">Sell</button></div></div>
      <div class="two"><div class="field"><label for="t-s">Symbol</label><input id="t-s" list="t-list" autocomplete="off" autocapitalize="characters" placeholder="e.g. MSFT" value="${esc(st.symbol)}"><datalist id="t-list">${D.universe.map(x => `<option value="${esc(x.symbol)}">${esc(x.name)}</option>`).join('')}</datalist></div>
      <div class="field"><label for="t-q">Shares${held && st.side === 'sell' ? ` <button type="button" class="linkbtn" id="t-all">all ${units(held)}</button>` : ''}</label><input id="t-q" inputmode="numeric" value="${esc(st.qty)}"></div></div>
      <div class="preview" id="t-prev">${u ? `<b>${esc(u.symbol)}</b> ${esc(u.name)} · ${money(u.price, 2)} · held ${units(held)}` : 'Choose a symbol from the approved list (stocks and funds).'}
      ${res ? (res.after || res.notional ? `<br>${st.side === 'buy' ? 'Buy' : 'Sell'} ${units(st.qty)} = <b>${money(res.notional)}</b> + ${money(res.fees, 2)} commission${res.after ? ` → <b>${pct(res.after.w[u.symbol] || 0, 2)}</b> of the portfolio` : ''}` : '') : ''}
      ${res && res.checks.length ? `<ul class="checks">${res.checks.map(c => `<li><span class="status ${c.state === 'block' ? 'breach' : c.state === 'warn' || c.state === 'still' ? 'warning' : 'ok'}">${c.state === 'block' ? 'Blocks' : c.state === 'warn' ? 'Warning' : c.state === 'still' ? 'Already outside' : 'OK'}</span><span>${esc(c.label)}${c.who ? ' (' + esc(c.who) + ')' : ''}: ${pct(c.v, 1)} vs ${c.l.min != null && c.l.max != null ? pct(c.l.min, 0) + '–' + pct(c.l.max, 0) : c.l.max != null ? '≤ ' + pct(c.l.max, 0) : '≥ ' + pct(c.l.min, 0)}</span></li>`).join('')}</ul>` : ''}
      ${res && res.msg ? `<p class="msg err" style="margin:8px 0 0">${esc(res.msg)}</p>` : ''}</div>
      <div class="dlg-foot"><button type="button" class="btn ghost" id="t-cancel">Cancel</button><button type="button" class="btn" id="t-go" ${res && res.ok && apiState === true ? '' : 'disabled'}>${st.side === 'buy' ? 'Place buy order' : 'Place sell order'}</button></div>`;
    body.querySelector('#t-p').addEventListener('change', e => { st.portfolio = e.target.value; render(); });
    body.querySelector('#t-side').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.side = b.dataset.v; render(); } });
    const s = body.querySelector('#t-s'), q = body.querySelector('#t-q');
    s.addEventListener('change', () => { st.symbol = s.value.trim().toUpperCase(); render(); });
    q.addEventListener('change', () => { st.qty = q.value.replace(/[,\s]/g, ''); render(); });
    [s, q].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); i.dispatchEvent(new Event('change')); } }));
    const all = body.querySelector('#t-all'); if (all) all.addEventListener('click', () => { st.qty = String(held); render(); });
    body.querySelector('#t-cancel').addEventListener('click', () => dlg.close());
    body.querySelector('#t-go').addEventListener('click', submit);
  }
  async function submit() {
    const b = body.querySelector('#t-go'); b.disabled = true; b.textContent = 'Sending…';
    try { const r = await fetch('api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ portfolio: st.portfolio, side: st.side, symbol: st.symbol.toUpperCase(), qty: Number(st.qty) }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) return render(j.error || `Couldn't send the order (HTTP ${r.status}).`); progress(j.id); }
    catch (e) { render('Network error. Check your connection and try again.'); }
  }
  render(); if (!dlg.open) dlg.showModal();
  if (apiState === null) checkApi().then(v => { apiState = v; if (dlg.open) render(); });
}
function progress(id) {
  body.innerHTML = `<h3>Order sent</h3><p class="note" id="pg-note" style="margin:0 0 8px">Compliance check, booking and a full dashboard rebuild usually take 1–2 minutes.</p>
    <ul class="steps"><li class="done" id="s1"><span class="dot">✓</span>Sent</li><li class="active" id="s2"><span class="dot"></span>Pre-trade compliance and booking</li><li id="s3"><span class="dot"></span>Rebuilding the dashboard</li></ul>
    <div id="pg-msg"></div><div class="dlg-foot"><button type="button" class="btn ghost" id="pg-close">Close</button></div>`;
  body.querySelector('#pg-close').addEventListener('click', () => dlg.close());
  const set = (n, s, mark = '') => { const li = body.querySelector('#s' + n); if (li) { li.className = s; li.querySelector('.dot').textContent = mark; } };
  const t0 = Date.now();
  const tick = async () => { if (!dlg.open) return;
    try { const j = await (await fetch('api/status?id=' + encodeURIComponent(id), { cache: 'no-store' })).json();
      if (j.log && j.log.status === 'completed') {
        if (j.log.conclusion !== 'success') { set(2, 'fail', '!'); body.querySelector('#pg-msg').innerHTML = `<p class="msg err">${esc(j.log.message || 'The order was rejected.')}</p>`; return; }
        set(2, 'done', '✓'); set(3, 'active'); if (j.log.message) body.querySelector('#pg-msg').innerHTML = `<p class="msg good">${esc(j.log.message)}</p>`;
        if (j.refresh && j.refresh.status === 'completed') { if (j.refresh.conclusion === 'success') { set(3, 'done', '✓'); setTimeout(() => location.reload(), 1800); return; } set(3, 'fail', '!'); return; } } }
    catch (e) {}
    if (Date.now() - t0 < 6 * 60000) setTimeout(tick, 4000); else body.querySelector('#pg-note').textContent = 'Still working; reload in a minute to see the trade.'; };
  setTimeout(tick, 3000);
}
document.getElementById('tradeBtn').addEventListener('click', () => openTrade());

route();
const born = Date.now(); setInterval(() => { if (document.visibilityState === 'visible' && !dlg.open && Date.now() - born > 15 * 60000) location.reload(); }, 30000);
})();
</script>
