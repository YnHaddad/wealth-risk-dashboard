name: Visitor trade
# Started by the dashboard's trade ticket (functions/api/log.js).
run-name: Order ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Request id from the dashboard
        required: true
        type: string
      payload:
        description: Order as JSON
        required: true
        type: string

permissions:
  contents: write
  actions: write

# No concurrency group: GitHub keeps only one pending run per group and would drop orders
# placed in a burst. The booking step retries against the latest ledger instead.

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pre-trade compliance, booking and commit
        env:
          PAYLOAD: ${{ inputs.payload }}
          REQ_ID: ${{ inputs.id }}
        run: |
          case "$REQ_ID" in *[!a-z0-9-]*|"") echo "bad id"; exit 1;; esac
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-run the check on the latest ledger until the push lands (another order may
          # have been booked in the meantime, which changes cash and limits).
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m wealth.visitors --apply --id "$REQ_ID"
            git add data/visitor_trades.csv data/visitor_requests.json
            git commit -qm "Visitor order $REQ_ID" || true
            if git push -q origin HEAD:main; then echo "booked on attempt $i"; exit 0; fi
            sleep $((RANDOM % 6 + 3))
          done
          echo "::error title=Could not save the order::push kept failing"; exit 1

      - name: Rebuild dashboard (only if a trade was booked)
        env:
          GH_TOKEN: ${{ github.token }}
          REQ_ID: ${{ inputs.id }}
        run: |
          ok=$(python -c "import json,os;print(json.load(open('data/visitor_requests.json'))[os.environ['REQ_ID']]['ok'])")
          if [ "$ok" = "True" ]; then gh workflow run refresh.yml --ref main -f quick=true; fi
