name: Visitor trade
# Started by the dashboard's trade ticket (functions/api/log.js).
run-name: Order ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Request id from the dashboard
        required: true
        type: string
      payload:
        description: Order as JSON
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pre-trade compliance and booking
        env:
          PAYLOAD: ${{ inputs.payload }}
          REQ_ID: ${{ inputs.id }}
        run: |
          case "$REQ_ID" in *[!a-z0-9-]*|"") echo "bad id"; exit 1;; esac
          python -m wealth.visitors --apply --id "$REQ_ID"

      - name: Commit
        env:
          REQ_ID: ${{ inputs.id }}
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor_trades.csv data/visitor_requests.json
          git commit -qm "Visitor order $REQ_ID"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Rebuild dashboard (only if a trade was booked)
        env:
          GH_TOKEN: ${{ github.token }}
          REQ_ID: ${{ inputs.id }}
        run: |
          ok=$(python -c "import json,os;print(json.load(open('data/visitor_requests.json'))[os.environ['REQ_ID']]['ok'])")
          if [ "$ok" = "True" ]; then gh workflow run refresh.yml --ref main -f quick=true; fi
